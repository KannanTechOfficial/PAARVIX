name: "💡 Feature Request"
description: "Suggest an idea or new capability for OmniViz"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide as much context as possible.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Data Connectors (SQL, Excel, Sheets, APIs)
        - Visualisation Panels & Charts
        - Observability & Fleet Monitoring
        - AI & Natural Language Querying
        - Alerting & Automation
        - Core Performance & Query Engine
    validations:
      required: true

